<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Multica 三套外观实施计划</title><style>body{font:15px/1.8 'Segoe UI',sans-serif;background:#f6f4f0;color:#302c29;max-width:850px;margin:48px auto;padding:0 24px}h1{color:#704d32}section{background:white;border:1px solid #e7ddd1;border-radius:12px;padding:20px 28px;margin:16px 0}code{background:#f4eee7;padding:2px 5px;border-radius:4px}</style><h1>三套外观实施计划</h1><p>基于用户确认的 C 石墨金铜、D 云雾青瓷、E 奶油砂金预览，替换未发布的少女粉方案。</p><section><h2>接入</h2><p>桌面主题提供器注册三个可持久化主题；石墨金铜使用 dark 类，两个浅色主题使用 light 类。桌面标记驱动主题变量；设置页和搜索命令按平台能力展示，六种语言提供名称。</p></section><section><h2>视觉</h2><p>分别覆盖页面、侧栏、浮层、边框、文字、品牌色等语义变量。按钮、输入框、卡片、浮层和 Dock 使用轻量渐变；保留原有布局、圆角和状态语义。</p></section><section><h2>验证</h2><p>检查主题选择、存储、切换恢复、标题栏、品牌色与正文对比度；运行关联测试与类型检查。开发窗口供用户验收，获得发布指示前不打包。</p></section></html>
