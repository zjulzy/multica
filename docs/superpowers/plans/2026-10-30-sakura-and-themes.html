<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三款桌面主题实施计划</title><style>body{font:16px/1.75 system-ui;max-width:850px;margin:4rem auto;color:#493d46}section{padding:1.2rem 1.5rem;margin:1rem 0;background:#fff5f9;border-radius:12px}h1,h2{color:#a44e75}</style><h1>三款桌面主题</h1><section><h2>设计</h2><p>新增樱花少女粉、月光薰衣草、深海蓝调。沿用桌面语义颜色、当前控件圆角与主题入口。樱花主题提供低对比度花朵与轻缓花瓣；花瓣仅在界面动效开启且系统未要求减少动画时运行，不影响指针或焦点。其他主题无樱花装饰。</p></section><section><h2>实施与检查</h2><ol><li>先测试主题注册、切换、持久化和关键颜色对比度。</li><li>添加三套语义令牌、设置及命令入口和六种语言名称。</li><li>在桌面主画布接入不拦截交互的樱花层，动画用 transform 与 opacity。</li><li>运行主题、设置、搜索、桌面布局及类型检查，用户体验后再发布。</li></ol><p>保留同一工作区未提交的个人统计改动。</p></section></html>
