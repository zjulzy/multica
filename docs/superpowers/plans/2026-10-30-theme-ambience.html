<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>主题专属动效实施计划</title><style>body{font:16px/1.75 system-ui;max-width:860px;margin:4rem auto;color:#34404d}section{background:#f2f6f8;border-radius:12px;padding:1.2rem 1.5rem;margin:1rem 0}h1,h2{color:#41677b}</style><h1>主题专属动效</h1><section><h2>设计</h2><p>石墨金铜使用暖金微光；云雾青瓷使用淡雾和小水珠；奶油砂金使用细小金光；月光薰衣草使用紫色闪星；深海蓝调用上浮气泡与水光。数量少、透明度低，不覆盖输入，不改变布局。</p><p>所有新增特效仅在该主题启用、界面动效开启且系统未设置减少动画时运行。樱花主题沿用自己的装饰与花瓣。</p></section><section><h2>验证</h2><ol><li>先测装饰层不可交互以及每个主题的开关规则。</li><li>实现固定数量的轻量元素，以 transform 和 opacity 动画。</li><li>通过浏览器无界面检查主题隔离、动效开关和系统减弱动画，再运行桌面测试与类型检查。</li><li>保留用户未提交的三主题和个人统计改动，供开发版体验。</li></ol></section></html>
