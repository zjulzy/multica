<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>长 Issue 与底栏性能优化</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:880px;margin:4rem auto;padding:0 2rem;color:#253344}h1,h2{color:#264f77}section{padding:1rem 1.5rem;margin:1rem 0;background:#f4f8fc;border-radius:12px}</style><h1>长 Issue 与底栏性能优化</h1><section><h2>目标</h2><p>降低长时间线及关闭底栏时的渲染开销，提供桌面端跳转到最新的入口；不依赖服务器变更。</p></section><section><h2>实现</h2><ol><li>底栏关闭动画结束后卸载不可见详情，保留未读计数、选中状态和草稿。</li><li>评论定位在虚拟列表中先定位所在行，再精确对齐评论；保留折叠回复、重放及滚动恢复。页内查找保持现有语义。</li><li>复用官方跳转逻辑，在桌面长页面提供浮动按钮。</li></ol></section><section><h2>验证</h2><p>覆盖底栏开关、切换、草稿、评论及回复定位、长列表与按钮显示；运行相关测试和类型检查，再在开发版进行体验验证。</p><p>限制：服务器仍一次返回完整时间线，网络传输量不会因本次改动减少。</p></section></html>
